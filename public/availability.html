<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Availability - Riftbound Scheduler</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="main-content" id="app" style="display:none">
    <div class="page-header">
      <h1>My Availability</h1>
      <p>Click time slots to mark when you're free this week <span id="weekBadge" class="week-badge"></span></p>
    </div>

    <div class="grid-controls">
      <span id="saveStatus" class="save-status"></span>
      <button class="btn-copy btn-small" id="copyProfileLink" style="margin-left:auto">Copy my profile link</button>
      <span class="copy-confirm" id="profileLinkConfirm">Copied!</span>
    </div>

    <div class="grid-wrapper">
      <div class="availability-grid" id="grid"></div>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/availability.js"></script>
</body>
</html>
