<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Riftbound Scheduler</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Join Riftbound Scheduler to coordinate tournament matches</p>

      <div id="error" class="error-message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="form-group">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" name="displayName" required maxlength="50">
        </div>
        <div class="form-group">
          <label for="timezone">Timezone</label>
          <select id="timezone" name="timezone" required>
            <option value="">Loading timezones...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pin">PIN</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" required class="pin-input" placeholder="------">
          <div class="pin-hint">Choose a 4-6 digit numeric PIN</div>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorEl = document.getElementById('error');
    const tzSelect = document.getElementById('timezone');
    const pinInput = document.getElementById('pin');

    // Only allow digits in PIN field
    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
    });

    const TZ_LABELS = {
      'America/New_York': 'US Eastern (New York)',
      'America/Chicago': 'US Central (Chicago)',
      'America/Denver': 'US Mountain (Denver)',
      'America/Los_Angeles': 'US Pacific (Los Angeles)',
      'America/Anchorage': 'US Alaska (Anchorage)',
      'America/Adak': 'US Hawaii-Aleutian (Adak)',
      'America/Phoenix': 'US Arizona (Phoenix)',
      'Pacific/Honolulu': 'US Hawaii (Honolulu)',
      'Europe/London': 'UK (London)',
      'Europe/Berlin': 'Europe Central (Berlin)',
      'Asia/Tokyo': 'Japan (Tokyo)',
      'Australia/Sydney': 'Australia Eastern (Sydney)',
      'Australia/Melbourne': 'Australia Eastern (Melbourne)',
    };

    async function loadTimezones() {
      try {
        const res = await fetch('/api/timezones');
        const data = await res.json();
        tzSelect.innerHTML = '';
        data.timezones.forEach(tz => {
          const opt = document.createElement('option');
          opt.value = tz;
          opt.textContent = TZ_LABELS[tz] || tz;
          tzSelect.appendChild(opt);
        });
        const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (data.timezones.includes(browserTz)) {
          tzSelect.value = browserTz;
        }
      } catch {
        tzSelect.innerHTML = '<option value="America/New_York">US Eastern (New York)</option>';
      }
    }

    loadTimezones();

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      const pin = pinInput.value;
      const timezone = tzSelect.value;

      if (!username || !displayName || !pin || !timezone) {
        return showError('Please fill in all fields');
      }
      if (username.length < 3) {
        return showError('Username must be at least 3 characters');
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        return showError('Username can only contain letters, numbers, and underscores');
      }
      if (!/^\d{4,6}$/.test(pin)) {
        return showError('PIN must be 4-6 digits');
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, displayName, password: pin, timezone })
        });
        const data = await res.json();
        if (!res.ok) {
          return showError(data.error || 'Registration failed');
        }
        window.location.href = '/availability';
      } catch (err) {
        showError('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
