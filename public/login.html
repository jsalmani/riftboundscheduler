<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Riftbound Scheduler</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Riftbound Scheduler</h1>
      <p class="subtitle">Sign in to manage your tournament availability</p>

      <div id="error" class="error-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="pin">PIN</label>
          <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required class="pin-input" placeholder="------">
          <div class="pin-hint">4-6 digit numeric PIN</div>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const pinInput = document.getElementById('pin');

    // Only allow digits in PIN field
    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const pin = pinInput.value;

      if (!username || !pin) {
        return showError('Please fill in all fields');
      }

      if (!/^\d{4,6}$/.test(pin)) {
        return showError('PIN must be 4-6 digits');
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: pin })
        });
        const data = await res.json();
        if (!res.ok) {
          return showError(data.error || 'Login failed');
        }
        window.location.href = '/availability';
      } catch (err) {
        showError('Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
